<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agentic OS</title>
  <script src="./theme-bootstrap.js"></script>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <aside id="sidebar" aria-label="Navigation"></aside>
  <main id="main">
    <header id="header"></header>
    <section id="view">
      <noscript>
        <div class="view-mount boot-failure">

          <p>Enable JavaScript to connect this window to your local team.</p>

    <footer id="composer"></footer>

  <button id="sidebar-scrim" type="button" aria-label="Close navigation" aria-hidden="true" tabindex="-1"></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
