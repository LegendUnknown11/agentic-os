name: test

on:
  push:
  pull_request:

# Two pushes in quick succession ran two full Windows jobs and only the second
# one's answer was ever read. Scoped by ref, so a branch push never cancels the
# run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # windows-latest, not a matrix: the daemon needs node:sqlite and every
    # Windows-only path (src/agent.js's IS_WIN guards) is untested on any
    # other OS — see PLAN.md's Phase 2.7, cross-platform is deliberately
    # deferred.
    runs-on: windows-latest
    # Measured: 143.4s locally at 4-wide, 165.4s here at 2-wide. The runner's
    # own ceiling is far higher — SUITE_TIMEOUT_MS is 180s and every failure is
    # retried once serially, so 68 hanging suites would run well over an hour
    # before test/run-all.js gave up. Without this, GitHub's default is 360
    # minutes, billed at 2x on Windows: one wedged suite costs six hours.
    # Thirty is 10x the honest run and still fails fast.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # package-lock.json is 169KB and npm ci is most of a three-minute job.
          cache: npm
      - run: npm ci
      # Scoped to production deps: electron-builder's own build-time tree
      # (xmldom, qs) carries pre-existing moderate/high advisories that never
      # ship in the app. Measured 2026-09-17: 0 findings at --audit-level=high
      # with --omit=dev.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
